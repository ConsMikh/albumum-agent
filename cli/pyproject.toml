[project]
name = "albumum-cli"
dynamic = ["version"]
description = "Утилита albumum: агентский интерфейс системы Albumum"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
albumum = "albumum_cli.main:main"

[dependency-groups]
dev = ["pytest", "respx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Версия одна — __version__ в albumum_cli/__init__.py; сборка зеркала подставляет туда тег.
[tool.hatch.version]
path = "albumum_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["albumum_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
